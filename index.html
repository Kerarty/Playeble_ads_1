<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Color Sort — Playable Ad</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0d0824; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';

/* =====================================================================
   ЧИСТАЯ ЛОГИКА ИГРЫ (без рендера).
   Она вынесена между LOGIC-BEGIN / LOGIC-END, чтобы её можно было
   прогнать тестами из Node: tools/test-level.mjs
   ===================================================================== */
// LOGIC-BEGIN
const WILD = -1;            // шар-джокер (радужный), подходит к любому цвету
const TUBE_CAP = 4;         // сколько шаров влезает в пробирку
const N_COLORS = 4;         // сколько цветов в уровне
const N_TUBES = 5;          // 4 полные + 1 пустая
const SEED = 20261005;      // фиксированный сид — уровень у всех игроков одинаковый

// детерминированный ГПСЧ (mulberry32), чтобы уровень не менялся от загрузки к загрузке
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// длина верхней серии одинаковых шаров
function topRun(balls) {
  const n = balls.length; if (!n) return 0;
  const top = balls[n - 1]; let k = 1;
  while (k < n && balls[n - 1 - k] === top) k++;
  return k;
}

function canPour(st, si, di) {
  if (si === di) return false;
  const s = st[si], d = st[di];
  if (!s.length || d.length >= TUBE_CAP) return false;
  const top = s[s.length - 1];
  if (!d.length) return true;
  const dt = d[d.length - 1];
  return top === WILD || dt === WILD || top === dt;
}

// применяем переливание к состоянию; adopt=true — джокер при приземлении
// принимает цвет шара, на который лёг (как в игре)
function applyPour(st, si, di, adopt) {
  if (!canPour(st, si, di)) return null;
  const k = Math.min(topRun(st[si]), TUBE_CAP - st[di].length);
  const ns = st.map(t => t.slice());
  const moved = ns[si].splice(ns[si].length - k, k);
  ns[di].push(...moved);
  if (adopt) {
    const len = ns[di].length;
    for (let q = 0; q < k; q++) {
      const idx = len - k + q;
      if (ns[di][idx] === WILD && idx > 0 && ns[di][idx - 1] !== WILD) ns[di][idx] = ns[di][idx - 1];
    }
  }
  return ns;
}

// пробирка собрана: полная и все шары одного цвета (джокер считается любым)
function isTubeComplete(t) {
  if (t.length < TUBE_CAP) return false;
  const ref = t.find(b => b !== WILD);
  if (ref === undefined) return true; // из одних джокеров
  return t.every(b => b === ref || b === WILD);
}

function isWin(st) { return st.every(t => t.length === 0 || isTubeComplete(t)); }

function stateKey(st) { return st.map(t => t.join(',')).sort().join('|'); }

// поиск решения в ширину — для проверки решаемости и подсказок
function solve(start) {
  const seen = new Set([stateKey(start)]);
  const queue = [[start, []]];
  let guard = 300000;
  while (queue.length && guard-- > 0) {
    const [st, path] = queue.shift();
    if (isWin(st)) return path;
    for (let si = 0; si < st.length; si++) {
      for (let di = 0; di < st.length; di++) {
        if (si === di) continue;
        const ns = applyPour(st, si, di, true);
        if (!ns) continue;
        const k = stateKey(ns);
        if (seen.has(k)) continue;
        seen.add(k);
        queue.push([ns, path.concat([[si, di]])]);
      }
    }
  }
  return null;
}

// генерация уровня: случайная раскладка шаров по 4 пробиркам (5-я пустая),
// затем проверка решаемости поиском в ширину. Раскладки бракуются, если
// что-то уже собрано или решение слишком короткое — так уровень интересный.
function generateLevel() {
  for (let attempt = 0; attempt < 2000; attempt++) {
    const rng = mulberry32(SEED + attempt * 7919);
    // мешок шаров: 4 цвета, у трёх по 4 шара, у одного 3 + шар-джокер
    const wildColor = (rng() * N_COLORS) | 0;
    const bag = [];
    for (let c = 0; c < N_COLORS; c++) {
      for (let k = 0; k < (c === wildColor ? TUBE_CAP - 1 : TUBE_CAP); k++) bag.push(c);
    }
    bag.push(WILD);
    // перемешиваем мешок и раскладываем по пробиркам
    for (let i = bag.length - 1; i > 0; i--) {
      const j = (rng() * (i + 1)) | 0;
      const t = bag[i]; bag[i] = bag[j]; bag[j] = t;
    }
    const st = [[], [], [], [], []];
    for (let i = 0; i < bag.length; i++) st[i >> 2].push(bag[i]);
    // контроль качества: ничего не собрано на старте, решение не короче 6 ходов
    if (st.some(t => t.length > 0 && isTubeComplete(t))) continue;
    const path = solve(st);
    if (!path || path.length < 6) continue;
    return { tubes: st, solution: path };
  }
  throw new Error('generateLevel: не удалось собрать уровень');
}
// LOGIC-END

/* =====================================================================
   РЕНДЕР И ВВОД (canvas)
   ===================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// виртуальная сцена 720x1280, вписываем в окно с сохранением пропорций
const STAGE_W = 720, STAGE_H = 1280;
let scaleCss = 1, offX = 0, offY = 0, dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const cw = window.innerWidth, ch = window.innerHeight;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  scaleCss = Math.min(cw / STAGE_W, ch / STAGE_H);
  offX = (cw - STAGE_W * scaleCss) / 2;
  offY = (ch - STAGE_H * scaleCss) / 2;
}
window.addEventListener('resize', resize);
resize();

const PALETTE = [
  { base: '#ff4d6d', light: '#ffa1b3', dark: '#c9184a' },  // красный
  { base: '#38d9a9', light: '#a0f0d9', dark: '#0ca678' },  // зелёный
  { base: '#4dabf7', light: '#a8d8ff', dark: '#1864ab' },  // синий
  { base: '#ffd43b', light: '#ffeaa0', dark: '#e0a800' },  // жёлтый
];
const RAINBOW = ['#ff4d6d', '#ff9f43', '#ffd43b', '#38d9a9', '#4dabf7', '#b197fc'];

// ссылки, которые подставляет рекламная сеть под конкретную кампанию
const CONFIG = {
  storeUrl: '', // например 'https://apps.apple.com/app/id000000' или https://play.google.com/...
  texts: {
    tapToPlay: 'TAP TO PLAY',
    tagline: 'Sort all colors into the tubes!',
    wildHint: 'The rainbow ball matches any color!',
    win: 'LEVEL COMPLETE!',
    cta: 'INSTALL NOW',
    replay: 'PLAY AGAIN',
    noMoves: 'NO MOVES!',
    retrying: 'retrying…',
  },
};

// геометрия пробирок
const TUBE_W = 100, TUBE_H = 380, BALL_R = 42, BALL_STEP = 84, TUBE_PAD_BOTTOM = 22;
const ROW1_Y = 712, ROW2_Y = 1152; // низ пробирок каждого ряда
const TUBES_XY = [
  [194, ROW1_Y], [360, ROW1_Y], [526, ROW1_Y],   // верхний ряд
  [277, ROW2_Y], [443, ROW2_Y],                  // нижний ряд
];

// ---- состояние приложения ----
let state = 'title';        // title | play | win
let time = 0, lastT = 0;
let level = null;
let gameState = [];         // пробирки: массивы цветов, снизу вверх
let locked = [];            // собранные пробирки (нельзя трогать)
let selected = -1;
let flights = [];           // летящие шары
let pouring = false;
let pourTiltIdx = -1, tiltSign = 0, tiltVal = 0;
let shake = [];
let particles = [];
let confetti = [];
let bokeh = [];
let completedColors = [];   // порядок собранных цветов — для прогресс-точек
let tutorialDone = false;
let hintSi = -1;
let winT = -1;
let deadTimer = -1;
let endCardT = 0;

function initLevel() {
  level = generateLevel();
  gameState = level.tubes.map(t => t.slice());
  locked = gameState.map(() => false);
  selected = -1; flights = []; pouring = false; pourTiltIdx = -1; tiltVal = 0;
  shake = gameState.map(() => 0);
  particles = []; confetti = [];
  completedColors = []; tutorialDone = false;
  winT = -1; deadTimer = -1; endCardT = 0;
  hintSi = level.solution.length ? level.solution[0][0] : -1;
}
initLevel();

for (let i = 0; i < 14; i++) {
  bokeh.push({
    x: Math.random() * STAGE_W, y: Math.random() * STAGE_H,
    r: 24 + Math.random() * 46, v: 10 + Math.random() * 18,
    a: 0.05 + Math.random() * 0.05, c: RAINBOW[i % RAINBOW.length],
  });
}

/* ---------------- звук (WebAudio, всё синтезируется на лету) ---------------- */
let AC = null;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function whoosh(dur, vol, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const len = Math.max(1, (dur * AC.sampleRate) | 0);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(700, t0);
  f.frequency.exponentialRampToValueAtTime(1900, t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(AC.destination); src.start(t0);
}
const sfx = {
  select()   { tone(520, 780, 0.07, 'sine', 0.14); },
  deselect() { tone(420, 300, 0.06, 'sine', 0.09); },
  toss()     { whoosh(0.18, 0.10); },
  land()     { tone(300, 140, 0.09, 'sine', 0.20); tone(650, 900, 0.05, 'triangle', 0.07, 0.01); },
  error()    { tone(150, 95, 0.18, 'sawtooth', 0.14); },
  complete() { [660, 880, 1175].forEach((f, i) => tone(f, f, 0.12, 'triangle', 0.16, i * 0.07)); whoosh(0.25, 0.05, 0.05); },
  win()      { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f, 0.22, 'triangle', 0.18, i * 0.09)); },
  click()    { tone(700, 1050, 0.08, 'sine', 0.15); },
};
function vib(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------------- геометрия/хелперы ---------------- */
function ballPos(tubeIdx, slotFromBottom) {
  const [x, yBottom] = TUBES_XY[tubeIdx];
  return [x, yBottom - TUBE_PAD_BOTTOM - BALL_R - slotFromBottom * BALL_STEP];
}
function tubeTopY(i) { return TUBES_XY[i][1] - TUBE_H; }
function rr(c, x, y, w, h, r) {
  c.beginPath();
  if (c.roundRect) { c.roundRect(x, y, w, h, r); return; }
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function starPath(c, x, y, r, rot) {
  c.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = (rot || 0) + k * Math.PI / 5 - Math.PI / 2;
    const rad = k % 2 === 0 ? r : r * 0.45;
    const px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    if (k) c.lineTo(px, py); else c.moveTo(px, py);
  }
  c.closePath();
}
function insideRect(x, y, r) { return Math.abs(x - r.x) <= r.w / 2 && Math.abs(y - r.y) <= r.h / 2; }
function insideCircle(x, y, c) { const dx = x - c.x, dy = y - c.y; return dx * dx + dy * dy <= c.r * c.r; }

/* ---------------- частицы ---------------- */
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = (spd || 260) * (0.4 + Math.random() * 0.9);
    particles.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
      g: 500, age: 0, life: 0.45 + Math.random() * 0.45,
      size: 4 + Math.random() * 6, color, diamond: Math.random() < 0.4,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 10,
    });
  }
}
function spawnConfetti(n) {
  for (let i = 0; i < n; i++) {
    confetti.push({
      x: Math.random() * STAGE_W, y: -30 - Math.random() * 260,
      vy: 150 + Math.random() * 140, w: 9 + Math.random() * 8, h: 12 + Math.random() * 10,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 8,
      color: RAINBOW[(Math.random() * RAINBOW.length) | 0],
      phase: Math.random() * Math.PI * 2,
    });
  }
}

/* ---------------- игровая логика (интерактив) ---------------- */
function startGame() {
  state = 'play';
  sfx.click();
}

function restartLevel() {
  initLevel();
  state = 'play';
}

function nudge(i) { shake[i] = 0.35; }

function startPour(si, di) {
  const k = Math.min(topRun(gameState[si]), TUBE_CAP - gameState[di].length);
  selected = -1; tutorialDone = true;
  pouring = true;
  const [sx] = TUBES_XY[si], [dx] = TUBES_XY[di];
  pourTiltIdx = si; tiltSign = dx > sx ? -1 : 1;
  const dstLen0 = gameState[di].length;
  const destTopBefore = dstLen0 ? gameState[di][dstLen0 - 1] : null;
  for (let j = 0; j < k; j++) {
    flights.push({
      color: null, si, di, j,
      t: -j * 0.085, dur: 0.32, arc: 120 + Math.abs(dx - sx) * 0.15,
      fx: 0, fy: 0, tx: 0, ty: 0, started: false, done: false,
      dstLen0, destTopBefore,
    });
  }
  sfx.toss();
}

function flightStart(f) {
  const len = gameState[f.si].length;
  f.color = gameState[f.si][len - 1];
  gameState[f.si].splice(len - 1, 1);
  const [fx, fy] = ballPos(f.si, len - 1);
  const [tx, ty] = ballPos(f.di, f.dstLen0 + f.j);
  f.fx = fx; f.fy = fy; f.tx = tx; f.ty = ty;
}

function flightLand(f) {
  f.done = true;
  gameState[f.di].push(f.color);
  if (f.color === WILD) {
    const n = gameState[f.di].length;
    const beneath = n >= 2 ? gameState[f.di][n - 2] : null;
    if (beneath !== null && beneath !== WILD) gameState[f.di][n - 1] = beneath; // джокер принимает цвет
  }
  sfx.land(); vib(12);
  const [px, py] = ballPos(f.di, gameState[f.di].length - 1);
  const col = f.color === WILD ? '#ffffff' : PALETTE[gameState[f.di][gameState[f.di].length - 1]].light;
  burst(px, py, col, 8, 200);
  // пробирка собралась?
  if (!locked[f.di] && gameState[f.di].length === TUBE_CAP && isTubeComplete(gameState[f.di])) {
    locked[f.di] = true;
    const ref = gameState[f.di].find(b => b !== WILD);
    completedColors.push(ref === undefined ? 0 : ref);
    sfx.complete(); vib([30, 40, 30]);
    burst(TUBES_XY[f.di][0], tubeTopY(f.di) - 10, PALETTE[ref === undefined ? 0 : ref].light, 20, 320);
  }
}

function afterPour() {
  pourTiltIdx = -1;
  if (isWin(gameState)) { triggerWin(); return; }
  // тупик: ходов нет или позиция уже не собрать — мягко перезапускаем уровень
  let any = false;
  outer:
  for (let i = 0; i < N_TUBES; i++) {
    for (let j = 0; j < N_TUBES; j++) {
      if (i === j || locked[i] || locked[j]) continue;
      if (canPour(gameState, i, j)) { any = true; break outer; }
    }
  }
  if (!any || !solve(gameState)) { deadTimer = 1.5; sfx.error(); }
}

function triggerWin() {
  state = 'win'; winT = 0; endCardT = 0;
  sfx.win(); vib([40, 60, 40, 60, 80]);
  setTimeout(() => spawnConfetti(34), 100);
  setTimeout(() => spawnConfetti(34), 550);
  setTimeout(() => spawnConfetti(34), 1000);
}

function openStore() {
  burst(CONFIG.ctaRect ? CONFIG.ctaRect.x : 360, CONFIG.ctaRect ? CONFIG.ctaRect.y : 950, '#ffffff', 18, 380);
  try {
    if (window.mraid && typeof window.mraid.open === 'function') { window.mraid.open(CONFIG.storeUrl); return; }
  } catch (e) {}
  if (CONFIG.storeUrl) window.open(CONFIG.storeUrl, '_blank');
}

/* ---------------- ввод ---------------- */
const restartBtn = { x: 652, y: 66, r: 36 };
const ctaRect = { x: 360, y: 0, w: 400, h: 112 };   // y пересчитывается в отрисовке
const replayRect = { x: 360, y: 0, r: 40 };

function toStage(e) {
  const rect = canvas.getBoundingClientRect();
  return [(e.clientX - rect.left - offX) / scaleCss, (e.clientY - rect.top - offY) / scaleCss];
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  const [x, y] = toStage(e);
  if (state === 'title') { startGame(); return; }
  if (state === 'play') { handlePlayTap(x, y); return; }
  if (state === 'win') { handleWinTap(x, y); }
});
document.addEventListener('contextmenu', e => e.preventDefault());

function handlePlayTap(x, y) {
  if (deadTimer > 0) return;
  if (insideCircle(x, y, restartBtn) || insideCircle(x, y, { ...restartBtn, r: restartBtn.r + 14 })) { restartLevel(); sfx.click(); return; }
  if (flights.length) return; // ждём конца переливания
  let hit = -1;
  for (let i = 0; i < N_TUBES; i++) {
    const [tx, tyB] = TUBES_XY[i];
    if (Math.abs(x - tx) <= 72 && y > tyB - TUBE_H - 30 && y < tyB + 24) { hit = i; break; }
  }
  if (hit < 0) {
    if (selected >= 0) { selected = -1; sfx.deselect(); }
    return;
  }
  if (selected < 0) {
    if (locked[hit] || !gameState[hit].length) { nudge(hit); return; }
    selected = hit; sfx.select();
    return;
  }
  if (selected === hit) { selected = -1; sfx.deselect(); return; }
  if (locked[selected] || locked[hit]) { nudge(hit); return; }
  if (canPour(gameState, selected, hit)) startPour(selected, hit);
  else { nudge(hit); sfx.error(); }
}

function handleWinTap(x, y) {
  if (winT < 1.2) return; // даём анимации проиграться
  if (insideRect(x, y, ctaRect)) { sfx.click(); openStore(); return; }
  if (insideCircle(x, y, replayRect)) { sfx.click(); restartLevel(); }
}

/* ---------------- обновление ---------------- */
function update(dt) {
  time += dt;
  for (const b of bokeh) {
    b.y -= b.v * dt;
    if (b.y < -b.r) { b.y = STAGE_H + b.r; b.x = Math.random() * STAGE_W; }
  }
  for (let i = 0; i < N_TUBES; i++) if (shake[i] > 0) shake[i] = Math.max(0, shake[i] - dt);

  // наклон пробирки при переливании
  tiltVal += ((pouring ? 1 : 0) - tiltVal) * Math.min(1, dt * 10);

  // летящие шары
  for (const f of flights) {
    f.t += dt;
    if (!f.started && f.t >= 0) { f.started = true; flightStart(f); }
    if (f.started && !f.done && f.t >= f.dur) flightLand(f);
  }
  const hadFlights = flights.length > 0;
  flights = flights.filter(f => !f.done);
  if (pouring && hadFlights && flights.length === 0) {
    pouring = false;
    afterPour();
  }

  // частицы
  for (const p of particles) {
    p.age += dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt;
    p.rot += p.vr * dt;
  }
  particles = particles.filter(p => p.age < p.life);
  for (const c of confetti) {
    c.y += c.vy * dt;
    c.x += Math.sin(time * 4 + c.phase) * 34 * dt;
    c.rot += c.vr * dt;
  }
  confetti = confetti.filter(c => c.y < STAGE_H + 50);

  if (state === 'win') { winT += dt; endCardT += dt; }
  if (deadTimer > 0) {
    deadTimer -= dt;
    if (deadTimer <= 0) restartLevel();
  }
}

/* ---------------- отрисовка ---------------- */
let bgGrad = null, vignette = null;
function getBg() {
  if (!bgGrad) {
    bgGrad = ctx.createLinearGradient(0, 0, 0, STAGE_H);
    bgGrad.addColorStop(0, '#2a1a5e');
    bgGrad.addColorStop(0.55, '#1b1042');
    bgGrad.addColorStop(1, '#120a2e');
  }
  return bgGrad;
}
function getVignette() {
  if (!vignette) {
    vignette = ctx.createRadialGradient(360, 620, 320, 360, 640, 780);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.4)');
  }
  return vignette;
}

function drawBall(x, y, color, s) {
  s = s || 1;
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  if (color === WILD) {
    const g = ctx.createLinearGradient(-BALL_R, -BALL_R, BALL_R, BALL_R);
    RAINBOW.forEach((c, i) => g.addColorStop(i / (RAINBOW.length - 1), c));
    ctx.fillStyle = g;
  } else {
    const p = PALETTE[color];
    const g = ctx.createRadialGradient(-BALL_R * 0.35, -BALL_R * 0.4, BALL_R * 0.15, 0, 0, BALL_R);
    g.addColorStop(0, p.light); g.addColorStop(0.55, p.base); g.addColorStop(1, p.dark);
    ctx.fillStyle = g;
  }
  ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, 7); ctx.fill();
  // обводка и блик
  ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.ellipse(-BALL_R * 0.32, -BALL_R * 0.42, BALL_R * 0.28, BALL_R * 0.16, -0.6, 0, 7); ctx.fill();
  if (color === WILD) { // искорка на джокере
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    const tw = 0.6 + 0.4 * Math.sin(time * 6);
    starPath(ctx, BALL_R * 0.4, BALL_R * 0.35, 8 * tw, time * 2); ctx.fill();
  }
  ctx.restore();
}

function drawStack(i) {
  const balls = gameState[i];
  const run = (selected === i) ? topRun(balls) : 0;
  for (let j = 0; j < balls.length; j++) {
    const localY = -TUBE_PAD_BOTTOM - BALL_R - j * BALL_STEP;
    let lift = 0;
    if (run && j >= balls.length - run) lift = 26 + Math.sin(time * 5) * 4;
    drawBall(0, localY - lift, balls[j]);
  }
}

function drawTube(i) {
  const [x, yB] = TUBES_XY[i];
  const shakeOff = shake[i] > 0 ? Math.sin(shake[i] * 40) * 8 * shake[i] : 0;
  const tilt = (pourTiltIdx === i ? tiltSign : 0) * 0.12 * tiltVal;
  ctx.save();
  ctx.translate(x + shakeOff, yB);
  if (tilt) ctx.rotate(tilt);
  // стекло
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  rr(ctx, -TUBE_W / 2, -TUBE_H, TUBE_W, TUBE_H, 24); ctx.fill();
  // шары
  drawStack(i);
  // контур
  if (locked[i]) {
    const ref = gameState[i].find(b => b !== WILD);
    ctx.shadowColor = PALETTE[ref === undefined ? 0 : ref].base;
    ctx.shadowBlur = 26;
  }
  ctx.strokeStyle = locked[i] ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.45)';
  ctx.lineWidth = 4;
  rr(ctx, -TUBE_W / 2, -TUBE_H, TUBE_W, TUBE_H, 24); ctx.stroke();
  ctx.shadowBlur = 0;
  // вертикальный блик стекла
  ctx.fillStyle = 'rgba(255,255,255,0.10)';
  rr(ctx, -TUBE_W / 2 + 8, -TUBE_H + 12, 14, TUBE_H - 34, 7); ctx.fill();
  ctx.restore();
}

function flightPos(f) {
  const u = Math.min(1, Math.max(0, f.t / f.dur));
  const mx = (f.fx + f.tx) / 2, my = Math.min(f.fy, f.ty) - f.arc;
  const x = (1 - u) * (1 - u) * f.fx + 2 * (1 - u) * u * mx + u * u * f.tx;
  const y = (1 - u) * (1 - u) * f.fy + 2 * (1 - u) * u * my + u * u * f.ty;
  return [x, y, 1 + 0.12 * Math.sin(Math.PI * u)];
}

function drawHUD() {
  // прогресс-точки
  for (let i = 0; i < N_COLORS; i++) {
    const x = 360 + (i - (N_COLORS - 1) / 2) * 44;
    ctx.beginPath(); ctx.arc(x, 64, 10, 0, 7);
    if (i < completedColors.length) {
      ctx.fillStyle = PALETTE[completedColors[i]].base; ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 3; ctx.stroke();
    } else {
      ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fill();
    }
  }
  // кнопка рестарта
  const pulse = deadTimer > 0 ? 1 + 0.08 * Math.sin(time * 10) : 1;
  ctx.save();
  ctx.translate(restartBtn.x, restartBtn.y); ctx.scale(pulse, pulse);
  ctx.strokeStyle = deadTimer > 0 ? '#ff6b81' : 'rgba(255,255,255,0.65)';
  ctx.fillStyle = deadTimer > 0 ? 'rgba(255,107,129,0.25)' : 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 0, restartBtn.r, 0, 7); ctx.fill(); ctx.stroke();
  // стрелка-круг
  ctx.beginPath(); ctx.arc(0, 0, 16, -0.4, Math.PI * 1.45); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(15, -12); ctx.lineTo(21, -2); ctx.lineTo(8, -3);
  ctx.closePath(); ctx.fillStyle = ctx.strokeStyle; ctx.fill();
  ctx.restore();
}

function drawTitle() {
  // затемнение поверх игры
  ctx.fillStyle = 'rgba(10,5,28,0.62)';
  ctx.fillRect(0, 0, STAGE_W, STAGE_H);
  // логотип
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
  ctx.font = '900 100px system-ui, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('COLOR', 360, 260 + Math.sin(time * 2) * 6);
  // SORT! — каждая буква своего цвета
  const word = 'SORT!';
  ctx.font = '900 110px system-ui, sans-serif';
  let widths = [], total = 0;
  for (const ch of word) { const w = ctx.measureText(ch).width; widths.push(w); total += w; }
  let cx = 360 - total / 2;
  for (let i = 0; i < word.length; i++) {
    const dy = Math.sin(time * 3 + i * 0.9) * 10;
    ctx.fillStyle = RAINBOW[i % RAINBOW.length];
    ctx.fillText(word[i], cx + widths[i] / 2, 396 + dy);
    cx += widths[i];
  }
  ctx.restore();
  // подпись
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '600 30px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(CONFIG.texts.tagline, 360, 505);
  ctx.font = '500 24px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText(CONFIG.texts.wildHint, 360, 548);
  // TAP TO PLAY
  const a = 0.65 + 0.35 * Math.sin(time * 4);
  ctx.font = '800 44px system-ui, sans-serif';
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  ctx.fillText(CONFIG.texts.tapToPlay, 360, 680);
  // рука-указатель
  const hy = 770 + Math.sin(time * 6) * 10;
  ctx.font = '64px system-ui, "Segoe UI Emoji", sans-serif';
  ctx.fillText('👆', 360, hy);
}

function drawHint() {
  if (tutorialDone || hintSi < 0 || state !== 'play' || pouring) return;
  const [x] = TUBES_XY[hintSi];
  const topY = tubeTopY(hintSi);
  // пульсирующее кольцо
  const r = 52 + 6 * Math.sin(time * 4);
  ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(x, topY + 60, r, 0, 7); ctx.stroke();
  // рука
  const hy = topY - 60 + Math.sin(time * 6) * 9;
  ctx.font = '58px system-ui, "Segoe UI Emoji", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('👆', x, hy);
  ctx.font = '800 30px system-ui, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('TAP', x, hy - 62);
}

function drawDeadOverlay() {
  if (deadTimer <= 0) return;
  ctx.fillStyle = 'rgba(10,5,28,0.45)';
  ctx.fillRect(0, 0, STAGE_W, STAGE_H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 64px system-ui, sans-serif';
  ctx.fillStyle = '#ff6b81';
  ctx.fillText(CONFIG.texts.noMoves, 360, 600);
  ctx.font = '600 30px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText(CONFIG.texts.retrying, 360, 660);
}

function easeOutBack(t) { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }

function drawWin() {
  const T = CONFIG.texts;
  // панель едет снизу
  const p = Math.min(1, endCardT / 0.6);
  const panelH = 560;
  const py = STAGE_H - easeOutBack(p) * panelH;
  if (p > 0) {
    ctx.fillStyle = 'rgba(12,6,32,0.86)';
    rr(ctx, 60, py, 600, panelH, 36); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 56px system-ui, sans-serif';
    ctx.fillStyle = '#ffd43b';
    ctx.fillText(T.win, 360, py + 92);
    // звёзды
    for (let i = 0; i < 3; i++) {
      const sp = Math.min(1, Math.max(0, (endCardT - 0.7 - i * 0.22) / 0.3));
      if (sp <= 0) continue;
      const s = easeOutBack(sp);
      ctx.save();
      ctx.translate(360 + (i - 1) * 120, py + 195);
      ctx.scale(s, s);
      if (i === 1) ctx.scale(1.25, 1.25);
      ctx.fillStyle = '#ffd43b'; ctx.strokeStyle = '#e0a800'; ctx.lineWidth = 3;
      starPath(ctx, 0, 0, 36, 0); ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    // CTA-кнопка
    ctaRect.y = py + 330;
    const pulse = 1 + 0.035 * Math.sin(time * 5);
    ctx.save();
    ctx.translate(ctaRect.x, ctaRect.y); ctx.scale(pulse, pulse);
    ctx.shadowColor = 'rgba(0,230,118,0.55)'; ctx.shadowBlur = 30;
    const g = ctx.createLinearGradient(0, -ctaRect.h / 2, 0, ctaRect.h / 2);
    g.addColorStop(0, '#00e676'); g.addColorStop(1, '#00b862');
    ctx.fillStyle = g;
    rr(ctx, -ctaRect.w / 2, -ctaRect.h / 2, ctaRect.w, ctaRect.h, 30); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 3; ctx.stroke();
    // бегущий блик
    ctx.save();
    rr(ctx, -ctaRect.w / 2, -ctaRect.h / 2, ctaRect.w, ctaRect.h, 30); ctx.clip();
    const sx = ((time * 340) % (ctaRect.w + 240)) - ctaRect.w / 2 - 120;
    const sg = ctx.createLinearGradient(sx, 0, sx + 120, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(0.5, 'rgba(255,255,255,0.35)');
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(-ctaRect.w / 2, -ctaRect.h / 2, ctaRect.w, ctaRect.h);
    ctx.restore();
    ctx.font = '900 42px system-ui, sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(T.cta, 0, 4);
    ctx.restore();
    // кнопка «ещё раз»
    replayRect.y = py + 470;
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(replayRect.x, replayRect.y, replayRect.r, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(replayRect.x, replayRect.y, 15, -0.4, Math.PI * 1.45); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(replayRect.x + 14, replayRect.y - 12);
    ctx.lineTo(replayRect.x + 20, replayRect.y - 2);
    ctx.lineTo(replayRect.x + 7, replayRect.y - 3);
    ctx.closePath(); ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
    ctx.font = '700 22px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.textAlign = 'left';
    ctx.fillText(T.replay, replayRect.x + 60, replayRect.y);
    ctx.textAlign = 'center';
  }
}

function draw() {
  // фон вне сцены и фон сцены
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0d0824';
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
  ctx.setTransform(dpr * scaleCss, 0, 0, dpr * scaleCss, dpr * offX, dpr * offY);

  ctx.fillStyle = getBg();
  ctx.fillRect(0, 0, STAGE_W, STAGE_H);
  // боке
  for (const b of bokeh) {
    ctx.globalAlpha = b.a;
    ctx.fillStyle = b.c;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // пробирки (выбранная — поверх остальных)
  const order = [];
  for (let i = 0; i < N_TUBES; i++) if (i !== selected) order.push(i);
  if (selected >= 0) order.push(selected);
  for (const i of order) drawTube(i);

  // летящие шары
  for (const f of flights) {
    if (!f.started || f.done) continue;
    const [x, y, s] = flightPos(f);
    drawBall(x, y, f.color, s);
  }

  // частицы
  for (const pt of particles) {
    ctx.globalAlpha = 1 - pt.age / pt.life;
    ctx.fillStyle = pt.color;
    if (pt.diamond) {
      ctx.save();
      ctx.translate(pt.x, pt.y); ctx.rotate(pt.rot);
      ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size);
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size / 2, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // конфетти
  for (const c of confetti) {
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  }

  // виньетка
  ctx.fillStyle = getVignette();
  ctx.fillRect(0, 0, STAGE_W, STAGE_H);

  if (state === 'play' || state === 'win') drawHUD();
  drawDeadOverlay();
  if (state === 'play') drawHint();
  if (state === 'title') drawTitle();
  if (state === 'win') drawWin();
}

/* ---------------- главный цикл ---------------- */
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
